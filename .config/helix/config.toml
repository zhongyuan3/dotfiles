theme = "onedark"

[editor]
mouse = false
bufferline = "multiple"
color-modes = true
auto-format = true
idle-timeout = 0

[editor.indent-guides]
render = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.search]
smart-case = true
wrap-around = true

[editor.soft-wrap]
enable = false

[editor.statusline]
left = ["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator"]
right = ["diagnostics", "selections", "register", "position", "file-encoding"]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "VISUAL"

[keys.normal]
H = "goto_line_start"
L = "goto_line_end"

[keys.normal."["]
b = "goto_previous_buffer"

[keys.normal."]"]
b = "goto_next_buffer"

[keys.insert.j]
k = "normal_mode"

[keys.select]
H = "extend_to_line_start"
L = "extend_to_line_end"
